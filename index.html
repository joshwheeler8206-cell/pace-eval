<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="U.S. AutoForce PACE Driving Evaluation - mobile ride-along form with built-in timers for eye lead, mirror intervals and following distance">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PACE Eval">
<title>U.S. AutoForce &middot; PACE Driving Evaluation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <img src="icons/icon-192.png" alt="U.S. AutoForce" class="brand-logo">
    <div>
      <div class="brand-eyebrow">U.S. AutoForce</div>
      <h1>PACE Driving Evaluation</h1>
      <p>Plan Ahead &middot; Analyze &middot; Communicate &middot; Execute</p>
    </div>
  </div>
</header>

<main id="view" class="view">
  <!-- Evaluate / Records views rendered by app.js -->
</main>

<nav class="tabbar">
  <button class="tab active" data-view="evaluate" aria-label="Evaluate">
    <svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2"/></svg>
    <span>Evaluate</span>
  </button>
  <button class="tab" data-view="records" aria-label="Records">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2"/></svg>
    <span>Records</span>
  </button>
</nav>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
